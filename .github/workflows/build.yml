name: Build Signed Arm64 Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Arm64 ABI and Release Minification
        run: |
          sed -i 's/defaultConfig {/defaultConfig {\n        ndk { abiFilters += listOf("arm64-v8a") }/' app/build.gradle.kts
          sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate Keystore and Sign Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias aurlegacy -storepass aurlegacy123 -keypass aurlegacy123 -dname "CN=Abin, OU=Dev, O=AurBrowser, L=Kasaragod, S=Kerala, C=IN"
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$APK_PATH" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-key-alias aurlegacy --ks-pass pass:aurlegacy123 --key-pass pass:aurlegacy123 --out AurBrowserLegacy-arm64-release.apk app-release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AurBrowserLegacy-arm64-release
          path: AurBrowserLegacy-arm64-release.apk
