<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Compact quality picker"><title>Compact quality picker</title><desc>A compact download quality card in the bottom-right corner with sizes, audio-only buttons and an Always best quality switch.</desc><defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66C8FF"/><stop offset=".5" stop-color="#1A7DFF"/><stop offset="1" stop-color="#7A4BFF"/></linearGradient>
