<text x="48" y="92" font-size="34" font-weight="800" fill="#fff" letter-spacing="-.6">Pick a quality, one-handed.</text>
<text x="48" y="124" font-size="16" fill="#9AA0AE">A compact card that sits where your right thumb rests, not a full-screen sheet.</text>
<text x="48" y="146" font-size="16" fill="#9AA0AE">The page stays visible behind it.</text>
<g font-size="14" font-weight="600" fill="#fff">
  <rect x="48" y="188" width="228" height="38" rx="19" fill="#fff" opacity=".07"/><text x="68" y="212">Bottom-right, thumb reach</text>
