<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#9AD8FF" stop-opacity="1"/><stop offset="1" stop-color="#7A4BFF" stop-opacity="0"/></linearGradient>
<filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
