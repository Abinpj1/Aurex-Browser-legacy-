<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="28" viewBox="0 0 1280 28" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Divider"><title>Divider</title><desc>Animated section divider</desc><defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66C8FF"/><stop offset=".5" stop-color="#1A7DFF"/><stop offset="1" stop-color="#7A4BFF"/></linearGradient>
<linearGradient id="gText" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AD8FF"/><stop offset="1" stop-color="#6E9BFF"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BF0A0"/><stop offset="1" stop-color="#30D158"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#9AD8FF" stop-opacity="1"/><stop offset="1" stop-color="#7A4BFF" stop-opacity="0"/></linearGradient>
<filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x="40" y="13" width="1200" height="2" rx="1" fill="url(#accent)" opacity=".28"/>
<rect x="-200" y="12" width="200" height="4" rx="2" fill="url(#sweep)">
  <animate attributeName="x" from="-200" to="1280" dur="5s" repeatCount="indefinite"/>
</rect>
<circle cx="640" cy="14" r="4" fill="#9AD8FF"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="14" r="10" fill="none" stroke="#66C8FF" stroke-opacity=".35"><animate attributeName="r" values="6;16;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>