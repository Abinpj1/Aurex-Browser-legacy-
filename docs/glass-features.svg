<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" role="img" aria-label="Aurex Browser features on Liquid Glass cards" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Aurex Browser features on Liquid Glass cards</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04060D"/><stop offset=".55" stop-color="#0A1838"/><stop offset="1" stop-color="#0F2A75"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  <!-- Liquid Glass: same layers as the app's liquidGlass modifier -->
  <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".82" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AC8FF"/><stop offset="1" stop-color="#0A60FF"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE58C"/><stop offset="1" stop-color="#1FA84A"/></linearGradient>
  <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E8DFF"/><stop offset="1" stop-color="#4B3FD6"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A80"/><stop offset="1" stop-color="#E02A3A"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E08BFF"/><stop offset="1" stop-color="#9B3FD6"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#F57C00"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#64D2FF"/></linearGradient>
</defs>
<rect width="880" height="352" rx="28" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".9">
  <circle cx="106" cy="299" r="120" fill="#30D0C6" opacity=".55"/>
  <circle cx="440" cy="35" r="130" fill="#0A84FF" opacity=".75"/>
  <circle cx="792" cy="194" r="140" fill="#BF5AF2" opacity=".55"/>
  <circle cx="634" cy="334" r="110" fill="#0A84FF" opacity=".6"/>
</g>
<g transform="translate(16,24)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
<g transform="translate(36,44)">
  <rect width="42" height="42" rx="11.8" fill="url(#gGreen)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
