</g>
<text x="36" y="116" fill="#fff" font-size="15.5" font-weight="600">Adblock and popup guard</text>
<text x="36" y="137" fill="#AEAEB5" font-size="12">EasyList, uBlock and AdGuard rules.</text>
<text x="36" y="154" fill="#AEAEB5" font-size="12">Popups and redirects stopped.</text>
<g transform="translate(304,24)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
