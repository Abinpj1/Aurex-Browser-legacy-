  <rect width="42" height="42" rx="11.8" fill="url(#gIndigo)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <g transform="translate(9.24,9.24) scale(0.980)"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.6" fill="#fff"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></g>
</g>
<text x="324" y="116" fill="#fff" font-size="15.5" font-weight="600">Private tabs</text>
<text x="324" y="137" fill="#AEAEB5" font-size="12">Locked with your phone's fingerprint,</text>
<text x="324" y="154" fill="#AEAEB5" font-size="12">face, PIN or pattern.</text>
<g transform="translate(592,24)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
<g transform="translate(612,44)">
  <rect width="42" height="42" rx="11.8" fill="url(#gBlue)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <g transform="translate(9.24,9.24) scale(0.980)"><path d="M12 4.5v10m0 0l-4-4m4 4l4-4M5.5 19.5h13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<text x="612" y="116" fill="#fff" font-size="15.5" font-weight="600">Multi-part downloads</text>
<text x="612" y="137" fill="#AEAEB5" font-size="12">Up to 16 connections, resumable.</text>
<text x="612" y="154" fill="#AEAEB5" font-size="12">HLS, DASH and plain files.</text>
<g transform="translate(16,190)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
<g transform="translate(36,210)">
  <rect width="42" height="42" rx="11.8" fill="url(#gRed)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <g transform="translate(9.24,9.24) scale(0.980)"><path d="M8 5.2l11 6.8-11 6.8z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></g>
</g>
<text x="36" y="282" fill="#fff" font-size="15.5" font-weight="600">Built-in player</text>
<text x="36" y="303" fill="#AEAEB5" font-size="12">Picture-in-Picture, background play,</text>
<text x="36" y="320" fill="#AEAEB5" font-size="12">smooth 2K and 4K YouTube.</text>
<g transform="translate(304,190)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
<g transform="translate(324,210)">
  <rect width="42" height="42" rx="11.8" fill="url(#gPurple)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <g transform="translate(9.24,9.24) scale(0.980)"><path d="M20 14.6A8 8 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z" fill="#fff"/></g>
</g>
<text x="324" y="282" fill="#fff" font-size="15.5" font-weight="600">Dark mode for any site</text>
<text x="324" y="303" fill="#AEAEB5" font-size="12">Works even when your phone is in light</text>
<text x="324" y="320" fill="#AEAEB5" font-size="12">mode. Photos and videos stay natural.</text>
<g transform="translate(592,190)">
  <rect width="272" height="150" rx="22" fill="#1C1C1E" fill-opacity=".50" filter="url(#shadow)"/>
  <rect width="272" height="150" rx="22" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="271" height="149" rx="21.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</g>
<g transform="translate(612,210)">
  <rect width="42" height="42" rx="11.8" fill="url(#gOrange)"/>
  <rect width="42" height="42" rx="11.8" fill="url(#spec)"/>
  <rect x=".5" y=".5" width="41" height="41" rx="11.3" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <g transform="translate(9.24,9.24) scale(0.980)"><rect x="4.5" y="4.5" width="15" height="15" rx="3.6" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 12h8M12 8v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
</g>
<text x="612" y="282" fill="#fff" font-size="15.5" font-weight="600">Long screenshots</text>
<text x="612" y="303" fill="#AEAEB5" font-size="12">Auto-scroll captures a whole page,</text>
<text x="612" y="320" fill="#AEAEB5" font-size="12">lazy images included.</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
